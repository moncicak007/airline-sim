<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Fullscreen & PWA značky -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AirlineSim">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <title>Airline Simulator</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="status">Načítání simulátoru...</div>

    <script src="index.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":365748,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        const statusElement = document.getElementById('status');

        engine.startGame({
            'onProgress': function (current, total) {
                if (total > 0) {
                    statusElement.innerText = "Načítání: " + Math.round((current / total) * 100) + "%";
                }
            }
        }).then(() => {
            statusElement.remove();
        }).catch((err) => {
            statusElement.innerText = "Chyba při spuštění:\n" + err;
            console.error(err);
        });
    </script>
</body>
</html>
